<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALZ Clock（拠点の天気・試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1F4E79}
  body{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;color:#fff}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .shade{position:absolute;inset:0;background:rgba(15,40,70,.5)}
  .box{position:relative;text-align:center}
  .date{font-size:clamp(11px,4vh,20px);letter-spacing:.12em;opacity:.95}
  .time{font-size:clamp(30px,20vh,88px);font-weight:700;line-height:1.1;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .line{width:56px;height:2px;background:#9CC3E8;margin:4px auto 8px}
  .ic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  /* A：順番に切り替え */
  .one{position:relative;font-size:clamp(11px,3.8vh,17px);line-height:1.5;text-align:center;min-height:3em;transition:opacity .4s;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .one .sub{opacity:.85;font-size:.9em}
  .one.fade{opacity:0}
  /* C：押して選ぶ */
  .chips{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px;padding:0 6px}
  .chip{font:inherit;font-size:clamp(10px,3vh,13px);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:1px 9px;cursor:pointer}
  .chip.on{background:#fff;color:#1F4E79;border-color:#fff;font-weight:700}
  .chip:focus-visible{outline:2px solid #9CC3E8;outline-offset:1px}
  /* B：一覧 */
  .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:clamp(10px,3.4vh,15px);line-height:1.45;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .grid div{white-space:nowrap}
  .grid .t{opacity:.9}
  .src{position:absolute;right:6px;bottom:3px;font-size:9px;opacity:.6;font-family:sans-serif}
  .hint{position:relative;font-size:clamp(9px,2.6vh,11px);opacity:.7;margin-top:3px;font-family:sans-serif}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="bg" id="bg"></div><div class="shade"></div>
  <div class="box">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <div class="line"></div>
  </div>
  <div id="panel" style="position:relative"></div>
  <div class="src">出典：気象庁</div>
</div>
<script>
/* 拠点の天気（試作）
   ?mode=rotate … A：5秒ごとに拠点を順番に切り替え
   ?mode=tap    … C：Aに加えて、拠点の名前を押すとその拠点で止まる（もう一度押すと再開）
   ?mode=list   … B：全部の拠点を一覧で表示
   ?bg=bg2.jpg  … 背景の写真
   天気は気象庁の天気予報（府県ごと）から。30分ごとに読み直す */
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'tap';
document.getElementById('bg').style.backgroundImage = `url("${Q.get('bg') || 'bg2.jpg'}")`;
const PLACES = [
  { key:'shinjuku',  name:'新宿',   office:'130000', area:'東京地方',   station:'東京' },
  { key:'osaka',     name:'大阪',   office:'270000', area:'大阪府',     station:'大阪' },
  { key:'nagoya',    name:'名古屋', office:'230000', area:'西部',       station:'名古屋' },
  { key:'kanazawa',  name:'金沢',   office:'170000', area:'加賀',       station:'金沢' },
  { key:'hamamatsu', name:'浜松',   office:'220000', area:'西部',       station:'浜松' },
  { key:'ishigaki',  name:'石垣島', office:'474000', area:'石垣島地方', station:'石垣島' },
].filter(p => !Q.get('places') || Q.get('places').split(',').includes(p.key));

const W = ['日','月','火','水','木','金','土'], pad = n => String(n).padStart(2,'0');
function tick(){
  const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  document.getElementById('date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${W[now.getDay()]}）`;
  document.getElementById('time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

// 気象庁の天気コード（3けた）の100の位で大まかに分ける
const ICON = c => { const h = Math.floor(Number(c)/100); return h===1?['☀️','晴れ']:h===2?['☁️','くもり']:h===3?['🌧️','雨']:h===4?['🌨️','雪']:['・','']; };
const DATA = {};
async function load(){
  const offices = [...new Set(PLACES.map(p => p.office))];
  await Promise.all(offices.map(async code => {
    try {
      const j = await (await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${code}.json`)).json();
      const ts = j[0].timeSeries;
      PLACES.filter(p => p.office === code).forEach(p => {
        const a = ts[0].areas.find(x => x.area.name === p.area) || ts[0].areas[0];
        const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
        const popAll = (ts[1].areas.find(x => x.area.name === p.area) || ts[1].areas[0]).pops;
        const pop = popAll.filter((v, i) => (ts[1].timeDefines[i] || '').slice(0, 10) === today);
        const st = ts[2].areas.find(x => x.area.name === p.station) || ts[2].areas[0];
        // 発表の時間によって並びが変わるため、今日の日中の最高は2つ目を使う
        const max = st.temps[1] ?? st.temps[0];
        const popToday = pop.filter(v => v !== '').map(Number);
        DATA[p.key] = { code: a.weatherCodes[0], text: a.weathers[0].replace(/\s+/g,''), max, pop: popToday.length ? Math.max(...popToday) : null };
      });
    } catch (e) { /* 取れない拠点は表示しない */ }
  }));
  render();
}

const panel = document.getElementById('panel');
let idx = 0, pinned = null;
function lineFor(p){
  const d = DATA[p.key]; if (!d) return `${p.name}　—`;
  const [ic, label] = ICON(d.code);
  return `<span class="ic">${ic}</span> ${p.name}　${label}　最高 ${d.max}℃<br><span class="sub">${d.pop!=null?`降水 ${d.pop}%`:''}</span>`;
}
function render(){
  if (MODE === 'list') {
    panel.innerHTML = '<div class="grid">' + PLACES.map(p => {
      const d = DATA[p.key]; const ic = d ? ICON(d.code)[0] : '・';
      return `<div><span class="ic">${ic}</span> ${p.name} <span class="t">${d ? d.max + '℃' : '—'}</span></div>`;
    }).join('') + '</div>';
    return;
  }
  const p = PLACES[pinned ?? idx];
  let html = `<div class="one" id="one">${lineFor(p)}</div>`;
  if (MODE === 'tap') {
    html += '<div class="chips">' + PLACES.map((q, i) =>
      `<button class="chip${i === (pinned ?? idx) ? ' on' : ''}" data-i="${i}" aria-pressed="${i === pinned}">${q.name}</button>`).join('') + '</div>';
    html += `<div class="hint">${pinned != null ? 'もう一度押すと自動の切り替えに戻ります' : '名前を押すとその拠点で止まります'}</div>`;
  }
  panel.innerHTML = html;
}
panel.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const i = Number(b.dataset.i);
  pinned = pinned === i ? null : i;
  if (pinned == null) idx = i;
  render();
});
setInterval(() => {
  if (MODE === 'list' || pinned != null) return;
  const one = document.getElementById('one'); if (one) one.classList.add('fade');
  setTimeout(() => { idx = (idx + 1) % PLACES.length; render(); }, 400);
}, 5000);
load(); setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
