<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALZ Clock（拠点の天気・試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1F4E79}
  body{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;color:#fff}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .shade{position:absolute;inset:0;background:rgba(15,40,70,.5)}
  .box{position:relative;text-align:center}
  .date{font-size:clamp(11px,4vh,20px);letter-spacing:.12em;opacity:.95}
  .time{font-size:clamp(30px,20vh,88px);font-weight:700;line-height:1.1;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .line{width:56px;height:2px;background:#9CC3E8;margin:4px auto 8px}
  .ic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  /* A：順番に切り替え */
  .one{position:relative;font-size:clamp(13px,5.2vh,22px);line-height:1.45;text-align:center;min-height:2.9em;transition:opacity .4s;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .one .sub{opacity:.9;font-size:.88em}
  .one .now{font-weight:700}
  .one.fade{opacity:0}
  /* C：押して選ぶ */
  .chips{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:0 6px}
  .chip{font:inherit;font-size:clamp(12px,4.2vh,17px);color:#fff;background:rgba(15,40,70,.45);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 8px;cursor:pointer;line-height:1.3}
  .chip:hover{background:rgba(255,255,255,.22)}
  .chip.on{background:#fff;color:#1F4E79;border-color:#fff;font-weight:700}
  .chip:focus-visible{outline:2px solid #9CC3E8;outline-offset:1px}
  /* B：一覧 */
  .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:clamp(10px,3.4vh,15px);line-height:1.45;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .grid div{white-space:nowrap}
  .grid .t{opacity:.9}
  .pin{font-size:.75em;opacity:.8;margin-left:.4em}
  .mode-tap .wrap{padding-bottom:46px;box-sizing:border-box}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="bg" id="bg"></div><div class="shade"></div>
  <div class="box">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <div class="line"></div>
  </div>
  <div id="panel" style="position:relative"></div>
  <div id="chips"></div>
</div>
<script>
/* 拠点の天気（試作）
   ?mode=rotate … A：5秒ごとに拠点を順番に切り替え
   ?mode=tap    … C：Aに加えて、拠点の名前を押すとその拠点で止まる（もう一度押すと再開）
   ?mode=list   … B：全部の拠点を一覧で表示
   ?bg=bg2.jpg  … 背景の写真
   天気・最高気温・降水確率は気象庁の天気予報（府県ごと）、現在の気温・最低気温はアメダスの観測から。10分ごとに読み直す */
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'tap';
document.body.classList.add('mode-' + MODE);
document.getElementById('bg').style.backgroundImage = `url("${Q.get('bg') || 'bg2.jpg'}")`;
const PLACES = [
  { key:'shinjuku',  name:'新宿',   office:'130000', area:'東京地方',   station:'東京',   amedas:'44132' },
  { key:'osaka',     name:'大阪',   office:'270000', area:'大阪府',     station:'大阪',   amedas:'62078' },
  { key:'nagoya',    name:'名古屋', office:'230000', area:'西部',       station:'名古屋', amedas:'51106' },
  { key:'kanazawa',  name:'金沢',   office:'170000', area:'加賀',       station:'金沢',   amedas:'56227' },
  { key:'hamamatsu', name:'浜松',   office:'220000', area:'西部',       station:'浜松',   amedas:'50456' },
  { key:'ishigaki',  name:'石垣島', office:'474000', area:'石垣島地方', station:'石垣島', amedas:'94081' },
].filter(p => !Q.get('places') || Q.get('places').split(',').includes(p.key));

const W = ['日','月','火','水','木','金','土'], pad = n => String(n).padStart(2,'0');
function tick(){
  const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  document.getElementById('date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${W[now.getDay()]}）`;
  document.getElementById('time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

// 気象庁の天気コード（3けた）の100の位で大まかに分ける
const ICON = c => { const h = Math.floor(Number(c)/100); return h===1?['☀️','晴れ']:h===2?['☁️','くもり']:h===3?['🌧️','雨']:h===4?['🌨️','雪']:['・','']; };
const DATA = {};
async function load(){
  const offices = [...new Set(PLACES.map(p => p.office))];
  await Promise.all(offices.map(async code => {
    try {
      const j = await (await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${code}.json`)).json();
      const ts = j[0].timeSeries;
      PLACES.filter(p => p.office === code).forEach(p => {
        const a = ts[0].areas.find(x => x.area.name === p.area) || ts[0].areas[0];
        const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
        const popAll = (ts[1].areas.find(x => x.area.name === p.area) || ts[1].areas[0]).pops;
        const pop = popAll.filter((v, i) => (ts[1].timeDefines[i] || '').slice(0, 10) === today);
        const st = ts[2].areas.find(x => x.area.name === p.station) || ts[2].areas[0];
        // 発表の時間によって並びが変わるため、今日の日中の最高は2つ目を使う
        const max = st.temps[1] ?? st.temps[0];
        const popToday = pop.filter(v => v !== '').map(Number);
        DATA[p.key] = { code: a.weatherCodes[0], text: a.weathers[0].replace(/\s+/g,''), max, pop: popToday.length ? Math.max(...popToday) : null };
      });
    } catch (e) { /* 取れない拠点は表示しない */ }
  }));
  await loadAmedas();
  render();
}

/* アメダス：今日0時からの観測（3時間ごとのファイル）から、現在の気温と今日の最低・最高を出す */
const JMA = 'https://www.jma.go.jp/bosai/amedas/data/';
async function loadAmedas(){
  try {
    const latest = new Date((await (await fetch(JMA + 'latest_time.txt')).text()).trim());
    const j = new Date(latest.getTime() + 9 * 3600e3);
    const day = `${j.getUTCFullYear()}${pad(j.getUTCMonth()+1)}${pad(j.getUTCDate())}`;
    const hours = []; for (let h = 0; h <= j.getUTCHours(); h += 3) hours.push(pad(h));
    await Promise.all(PLACES.map(async p => {
      const temps = [];
      await Promise.all(hours.map(async h => {
        try {
          const d = await (await fetch(`${JMA}point/${p.amedas}/${day}_${h}.json`)).json();
          Object.keys(d).forEach(k => { const t = d[k].temp; if (t && t[1] === 0 && t[0] != null) temps.push([k, t[0]]); });
        } catch (e) {}
      }));
      if (!temps.length) return;
      temps.sort((a, b) => a[0] < b[0] ? -1 : 1);
      const v = temps.map(x => x[1]);
      DATA[p.key] = Object.assign(DATA[p.key] || {}, { now: temps[temps.length - 1][1], obsMin: Math.min(...v), obsMax: Math.max(...v) });
    }));
  } catch (e) { /* 観測が取れないときは予報だけ出す */ }
}

const panel = document.getElementById('panel');
let idx = 0, pinned = null;
function lineFor(p){
  const d = DATA[p.key]; if (!d) return `${p.name}　—`;
  const [ic, label] = ICON(d.code);
  const r = n => Math.round(Number(n));
  // 最高：予報の最高と、ここまでの観測の最高の高いほう
  const hi = [d.max, d.obsMax].filter(x => x != null && x !== '').map(Number);
  const parts = [];
  if (hi.length) parts.push(`最高 ${r(Math.max(...hi))}℃`);
  if (d.obsMin != null) parts.push(`最低 ${r(d.obsMin)}℃`);
  if (d.pop != null) parts.push(`降水 ${d.pop}%`);
  return `<span class="ic">${ic}</span> ${p.name}　${label}　<b class="now">${d.now != null ? d.now.toFixed(1) + '℃' : ''}</b>${pinned!=null?'<span class="pin">（固定中）</span>':''}<br><span class="sub">${parts.join(' ／ ')}</span>`;
}
function render(){
  if (MODE === 'list') {
    panel.innerHTML = '<div class="grid">' + PLACES.map(p => {
      const d = DATA[p.key]; const ic = d ? ICON(d.code)[0] : '・';
      return `<div><span class="ic">${ic}</span> ${p.name} <span class="t">${d && d.now != null ? d.now.toFixed(1) + '℃' : d ? d.max + '℃' : '—'}</span></div>`;
    }).join('') + '</div>';
    return;
  }
  const p = PLACES[pinned ?? idx];
  panel.innerHTML = `<div class="one" id="one">${lineFor(p)}</div>`;
  if (MODE === 'tap') {
    document.getElementById('chips').innerHTML = '<div class="chips">' + PLACES.map((q, i) =>
      `<button class="chip${i === (pinned ?? idx) ? ' on' : ''}" data-i="${i}" aria-pressed="${i === pinned}" title="${i === pinned ? 'もう一度押すと自動の切り替えに戻ります' : 'この拠点で止めます'}">${q.name}</button>`).join('') + '</div>';
  }
}
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const i = Number(b.dataset.i);
  pinned = pinned === i ? null : i;
  if (pinned == null) idx = i;
  render();
});
setInterval(() => {
  if (MODE === 'list' || pinned != null) return;
  const one = document.getElementById('one'); if (one) one.classList.add('fade');
  setTimeout(() => { idx = (idx + 1) % PLACES.length; render(); }, 400);
}, 5000);
load(); setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
